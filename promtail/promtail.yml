server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lcfa3-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: lcfa3-app-logs
          host: lcfa3-app
          __path__: /logs/app.log

  - job_name: lcfa3-db-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: lcfa3-db-logs
          host: lcfa3-app
          __path__: /logs/db.log
