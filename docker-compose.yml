services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_lc_fa
    ports:
      - 8000:8000
    volumes:
      - ./:/code
    depends_on:
      redis:
        condition: service_healthy
#    depends_on:
#      migrations:
#        condition: service_completed_successfully

  #migrations:
  #  build: .
  #  command: alembic upgrade head
  #  depends_on:
  #    db:
  #      condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_lc_fa
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: postgres_lcfa
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: lc
    ports:
      - 5432:5432
    volumes:
        - postgres_data_lc:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d lc" ]
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: redis_lcfa3
    restart: unless-stopped
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_lc:
